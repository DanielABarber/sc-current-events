<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC.Current.Events</title>
<meta name="description" content="A curated resource for students: links on heat waves, energy transition, hope, architecture, and events.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrap">
    <h1 class="site-title">SC.Current.Events</h1>

    <nav class="category-grid" id="categoryGrid" aria-label="Browse by category"></nav>

    <section class="add-link">
      <span class="eyebrow">Add a link</span>
      <form id="addForm">
        <div class="row">
          <div>
            <label for="url">URL</label>
            <input id="url" type="url" placeholder="https://..." required>
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category" required>
              <option value="" disabled selected>Choose one&hellip;</option>
            </select>
          </div>
        </div>
        <button type="submit" id="submitBtn">Add to list</button>
      </form>
      <div id="status" class="status"></div>
    </section>
  </div>

  <footer>&copy; <span id="year"></span> SC.Current.Events. Built as a static site.</footer>

  <script src="js/site.js"></script>
  <script>
    function slugId(date) {
      return (date || '') + '-' + Math.random().toString(36).slice(2, 8);
    }

    function renderCategoryButtons() {
      document.getElementById('categoryGrid').innerHTML = CATEGORIES.map(c => `
        <a class="category-btn" href="${c.slug}.html">${escapeHtml(c.label)}</a>
      `).join('');
    }

    function renderCategoryOptions() {
      const select = document.getElementById('category');
      CATEGORIES.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.slug;
        opt.textContent = c.label;
        select.appendChild(opt);
      });
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      const urlInput = document.getElementById('url');
      const categorySelect = document.getElementById('category');
      const rawUrl = urlInput.value.trim();

      submitBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Reading the link…';

      let meta = { title: null, author: null, date: null };
      let readFailed = false;
      try {
        const res = await fetch('/.netlify/functions/metadata?url=' + encodeURIComponent(rawUrl));
        const data = await res.json();
        if (res.ok) {
          meta = data;
        } else {
          readFailed = true;
        }
      } catch (err) {
        readFailed = true;
      }

      const entry = {
        id: slugId(meta.date || todayIso()),
        title: meta.title || new URL(rawUrl).hostname.replace(/^www\./, ''),
        url: rawUrl,
        author: meta.author || '',
        date: meta.date || todayIso(),
        category: categorySelect.value,
      };

      let existing = [];
      let loadFailed = false;
      try {
        existing = await loadArticles();
      } catch (err) {
        loadFailed = true;
      }

      const updated = [...existing, entry];
      const blob = new Blob([JSON.stringify(updated, null, 2)], { type: 'application/json' });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = 'articles.json';
      a.click();
      URL.revokeObjectURL(blobUrl);

      const pieces = [`Added "${entry.title}"`];
      if (entry.author) pieces.push(`by ${entry.author}`);
      pieces.push(`(${entry.date})`);
      let message = pieces.join(' ') + '. Downloaded articles.json — replace data/articles.json in the repo, then commit and push.';
      if (readFailed) message = `Couldn't read that page automatically, so this was added using the domain name and today's date — edit the downloaded file if you'd like to fix it. ${message}`;
      if (loadFailed) message += ' (Could not load the existing data/articles.json automatically — this download only has the new entry, so merge it in by hand.)';
      statusEl.textContent = message;
      statusEl.className = readFailed || loadFailed ? 'status err' : 'status ok';

      submitBtn.disabled = false;
      e.target.reset();
      urlInput.focus();
    });

    document.getElementById('year').textContent = new Date().getFullYear();
    renderCategoryButtons();
    renderCategoryOptions();
  </script>

</body>
</html>
