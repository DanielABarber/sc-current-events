<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC.Current.Events</title>
<meta name="description" content="A curated resource for students: links on heat waves, energy transition, hope, architecture, and events.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrap">
    <h1 class="site-title">SC.Current.Events</h1>

    <nav class="category-grid" id="categoryGrid" aria-label="Browse by category"></nav>

    <section class="add-link">
      <span class="eyebrow">Add a link</span>
      <form id="addForm">
        <div>
          <label for="url">URL</label>
          <input id="url" type="url" placeholder="https://..." required>
        </div>
        <div>
          <label for="title">Title</label>
          <input id="title" type="text" required>
        </div>
        <div class="row">
          <div>
            <label for="author">Author</label>
            <input id="author" type="text" placeholder="e.g. Jane Smith">
          </div>
          <div>
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category" required>
              <option value="" disabled selected>Choose one&hellip;</option>
            </select>
          </div>
        </div>
        <button type="submit">Add to list</button>
      </form>
      <div id="status" class="status"></div>
    </section>
  </div>

  <footer>&copy; <span id="year"></span> SC.Current.Events. Built as a static site.</footer>

  <script src="js/site.js"></script>
  <script>
    function slugId(date) {
      return (date || '') + '-' + Math.random().toString(36).slice(2, 8);
    }

    function renderCategoryButtons() {
      document.getElementById('categoryGrid').innerHTML = CATEGORIES.map(c => `
        <a class="category-btn" href="${c.slug}.html">${escapeHtml(c.label)}</a>
      `).join('');
    }

    function renderCategoryOptions() {
      const select = document.getElementById('category');
      CATEGORIES.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.slug;
        opt.textContent = c.label;
        select.appendChild(opt);
      });
    }

    document.getElementById('date').valueAsDate = new Date();

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const entry = {
        id: slugId(document.getElementById('date').value),
        title: document.getElementById('title').value.trim(),
        url: document.getElementById('url').value.trim(),
        author: document.getElementById('author').value.trim(),
        date: document.getElementById('date').value,
        category: document.getElementById('category').value,
      };

      let existing = [];
      try {
        existing = await loadArticles();
      } catch (err) {
        statusEl.textContent = 'Could not load the current data/articles.json (this can happen when opening the file directly instead of via a server) — downloading just this entry instead.';
        statusEl.className = 'status err';
      }

      const updated = [...existing, entry];
      const blob = new Blob([JSON.stringify(updated, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'articles.json';
      a.click();
      URL.revokeObjectURL(url);

      if (statusEl.className !== 'status err') {
        statusEl.textContent = 'Downloaded articles.json — replace data/articles.json in the repo with it, then commit and push.';
        statusEl.className = 'status ok';
      }

      e.target.reset();
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('url').focus();
    });

    document.getElementById('year').textContent = new Date().getFullYear();
    renderCategoryButtons();
    renderCategoryOptions();
  </script>

</body>
</html>
