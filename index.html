<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC.Current.Events</title>
<meta name="description" content="A curated resource for students: links on heat waves, energy transition, hope, architecture, and events.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrap">
    <h1 class="site-title">SC.Current.Events</h1>

    <nav class="category-grid" id="categoryGrid" aria-label="Browse by category"></nav>

    <section class="add-link">
      <span class="eyebrow">Add a link</span>
      <form id="addForm">
        <div class="row">
          <div>
            <label for="url">URL</label>
            <input id="url" type="url" placeholder="https://..." required>
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category" required>
              <option value="" disabled selected>Choose one&hellip;</option>
            </select>
          </div>
        </div>
        <button type="submit" id="submitBtn">Add to list</button>
      </form>
      <div id="status" class="status"></div>
    </section>
  </div>

  <footer>&copy; <span id="year"></span> SC.Current.Events. Built as a static site.</footer>

  <script src="js/site.js"></script>
  <script>
    function renderCategoryButtons() {
      document.getElementById('categoryGrid').innerHTML = CATEGORIES.map(c => `
        <a class="category-btn" href="${c.slug}.html">${escapeHtml(c.label)}</a>
      `).join('');
    }

    function renderCategoryOptions() {
      const select = document.getElementById('category');
      CATEGORIES.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.slug;
        opt.textContent = c.label;
        select.appendChild(opt);
      });
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      const urlInput = document.getElementById('url');
      const categorySelect = document.getElementById('category');
      const rawUrl = urlInput.value.trim();
      const category = categorySelect.value;

      submitBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Reading the link…';

      try {
        const res = await fetch('/.netlify/functions/articles', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ url: rawUrl, category }),
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.error || 'Could not add that link.';
          statusEl.className = 'status err';
        } else {
          const { entry, readFailed } = data;
          const pieces = [`Added "${entry.title}"`];
          if (entry.author) pieces.push(`by ${entry.author}`);
          pieces.push(`(${entry.date}) to ${CATEGORIES.find(c => c.slug === entry.category)?.label || entry.category}.`);
          let message = pieces.join(' ');
          if (readFailed) message = `Couldn't read that page automatically, so this was added using the domain name and today's date. ${message}`;
          statusEl.textContent = message;
          statusEl.className = 'status ok';
          e.target.reset();
        }
      } catch (err) {
        statusEl.textContent = 'Could not reach the server — check your connection and try again.';
        statusEl.className = 'status err';
      }

      submitBtn.disabled = false;
      urlInput.focus();
    });

    document.getElementById('year').textContent = new Date().getFullYear();
    renderCategoryButtons();
    renderCategoryOptions();
  </script>

</body>
</html>
