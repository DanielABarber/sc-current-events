<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC.Current.Events</title>
<meta name="description" content="A curated feed of articles, papers, and links on architecture, climate, and sufficiency.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAD4BC;
    --paper-deep: #E0C3A0;
    --ink: #22262B;
    --ink-soft: #565B57;
    --dark: #1C2420;
    --dark-text: #E6E2D6;
    --dark-dim: #8B9089;
    --teal: #3E6B5E;
    --rust: #9C5A34;
    --rule: #B7B0A0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    line-height: 1.6;
    font-size: 17px;
  }

  a { color: var(--ink); text-decoration: underline dotted; text-decoration-color: var(--ink); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { color: var(--teal); text-decoration-style: solid; text-decoration-color: var(--teal); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--rust); outline-offset: 3px; }

  h1, h2, h3 { font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }
  .mono { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; font-weight: 500; }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    color: var(--rust);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    display: block;
  }

  .wrap { max-width: 780px; margin: 0 auto; padding: 3.5rem 1.5rem 4rem; }

  header.site-head { margin-bottom: 2.5rem; }
  header.site-head h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 700; margin-bottom: 0.5rem; }
  header.site-head p { color: var(--ink-soft); font-size: 0.95rem; max-width: 46em; }
  header.site-head .back-link { display: inline-block; margin-top: 1rem; font-size: 0.78rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-soft); }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--rule);
  }

  .tag-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--paper-deep);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tag-btn:hover { border-color: var(--teal); color: var(--teal); }
  .tag-btn.active { background: var(--dark); color: var(--dark-text); border-color: var(--dark); }
  .tag-btn .count { color: var(--ink-soft); margin-left: 0.3rem; font-size: 0.72rem; }
  .tag-btn.active .count { color: var(--dark-dim); }

  .entries { list-style: none; }

  .entry {
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--rule);
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }
  .entry:last-child { border-bottom: none; }

  .entry-date {
    flex: 0 0 4.4rem;
    color: var(--rust);
    font-size: 0.82rem;
    padding-top: 0.15rem;
  }

  .entry-body { flex: 1 1 auto; min-width: 0; }

  .entry-title-row { display: flex; align-items: baseline; gap: 0.55rem; flex-wrap: wrap; }
  .entry h3 { font-size: 1rem; font-weight: 600; line-height: 1.35; }
  .entry h3 a { color: var(--ink); }

  .type-badge {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.12rem 0.4rem;
    border-radius: 3px;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .type-badge.pdf { color: #fff; background: var(--rust); }
  .type-badge.news { color: #fff; background: var(--teal); }
  .type-badge.article { color: var(--ink-soft); background: var(--paper-deep); border: 1px solid var(--rule); }

  .entry-source { font-size: 0.82rem; color: var(--ink-soft); margin-top: 0.15rem; }

  .entry-tags { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .entry-tags button {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline dotted;
    text-underline-offset: 2px;
  }
  .entry-tags button:hover { color: var(--teal); }

  .empty-state {
    color: var(--ink-soft);
    font-style: italic;
    padding: 2rem 0;
  }

  footer {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }
  footer a { color: var(--ink-soft); }

  @media (max-width: 560px) {
    .wrap { padding: 2.5rem 1.25rem 3rem; }
    .entry { flex-direction: column; gap: 0.3rem; }
    .entry-date { flex: none; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <header class="site-head">
      <span class="eyebrow">SC.Current.Events</span>
      <h1>A running feed of links worth reading</h1>
      <p>Articles, papers, and other online reading on architecture, climate, and sufficiency &mdash; tagged and filterable. PDFs and articles always link out to their original source.</p>
      <a class="back-link" href="https://danielabarber.net/">&larr; danielabarber.net</a>
    </header>

    <nav class="tag-row" id="tagRow" aria-label="Filter by tag"></nav>

    <ul class="entries" id="entries"></ul>
  </div>

  <footer>&copy; <span id="year"></span> Daniel A. Barber. Built as a static site.</footer>

  <script>
    const state = { articles: [], activeTag: null };

    async function loadArticles() {
      const res = await fetch('data/articles.json', { cache: 'no-store' });
      state.articles = await res.json();
      render();
    }

    function uniqueTags() {
      const counts = new Map();
      state.articles.forEach(a => {
        (a.tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1));
      });
      return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    }

    function setActiveTag(tag) {
      state.activeTag = state.activeTag === tag ? null : tag;
      render();
    }

    function typeLabel(type) {
      if (type === 'pdf') return 'PDF';
      if (type === 'news') return 'News';
      return 'Article';
    }

    function formatDate(iso) {
      const d = new Date(iso + 'T00:00:00');
      if (isNaN(d)) return iso;
      return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });
    }

    function render() {
      const tagRow = document.getElementById('tagRow');
      const tags = uniqueTags();
      tagRow.innerHTML = tags.map(([tag, count]) => `
        <button class="tag-btn${state.activeTag === tag ? ' active' : ''}" data-tag="${escapeAttr(tag)}">
          ${escapeHtml(tag)}<span class="count">${count}</span>
        </button>
      `).join('');
      tagRow.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => setActiveTag(btn.dataset.tag));
      });

      const filtered = state.articles
        .filter(a => !state.activeTag || (a.tags || []).includes(state.activeTag))
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      const list = document.getElementById('entries');
      if (filtered.length === 0) {
        list.innerHTML = '<li class="empty-state">No entries yet.</li>';
        return;
      }

      list.innerHTML = filtered.map(a => `
        <li class="entry">
          <div class="entry-date mono">${formatDate(a.date)}</div>
          <div class="entry-body">
            <div class="entry-title-row">
              <h3><a href="${escapeAttr(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></h3>
              <span class="type-badge ${escapeAttr(a.type || 'article')}">${typeLabel(a.type)}</span>
            </div>
            ${a.source ? `<div class="entry-source">${escapeHtml(a.source)}</div>` : ''}
            ${(a.tags && a.tags.length) ? `<div class="entry-tags">${a.tags.map(t => `<button data-tag="${escapeAttr(t)}">#${escapeHtml(t)}</button>`).join('')}</div>` : ''}
          </div>
        </li>
      `).join('');

      list.querySelectorAll('.entry-tags button').forEach(btn => {
        btn.addEventListener('click', () => setActiveTag(btn.dataset.tag));
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function escapeAttr(str) { return escapeHtml(str); }

    document.getElementById('year').textContent = new Date().getFullYear();
    loadArticles();
  </script>

</body>
</html>
